[package]
name = "anka"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "Anka – MC68000 CPU emulator with bitvector semantics"

[dependencies]
libc = "0.2"

[dev-dependencies]

[[bin]]
name = "anka"
path = "src/main.rs"

# Optimized host sampling; runtime semantics remain those of release.
[profile.profiling]
inherits = "release"
debug = true
strip = false
